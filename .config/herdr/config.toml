# herdr configuration
# Place this file at ~/.config/herdr/config.toml

onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
red = "#4e82ef"     # blocked, needs input
teal = "#4e82ef"    # done, not seen yet
yellow = "#a78bfa"  # working
active_row_bg = "#45475a"

[terminal]

[update]

[keys]

prefix = "ctrl+space"

# Prefix-mode actions
detach = "prefix+d"
settings = "prefix+,"
rename_workspace = ["prefix+ctrl+w", "cmd+r"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+z"       # legacy alias: fullscreen
resize_mode = "prefix+r"
resize_pane_left = "ctrl+shift+alt+h"   # optional, e.g. "ctrl+shift+alt+left" resizes without entering resize mode
resize_pane_down = "ctrl+shift+alt+k"   # optional, e.g. "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+j"     # optional, e.g. "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+l"  # optional, e.g. "ctrl+shift+alt+right"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
navigate_workspace_up = ["k", "p"]
navigate_workspace_down = ["j", "n"]

new_tab = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
goto = ["prefix+g", "cmd+k"]
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
previous_workspace = "ctrl+cmd+h" 
next_workspace = "ctrl+cmd+l" 
switch_tab = "prefix+1..9"
switch_workspace = "alt+cmd+1..9"
focus_agent = ""
previous_agent = "ctrl+cmd+k"
copy_mode = "prefix+["
next_agent = ["prefix+]", "ctrl+cmd+j"]
cycle_pane_next = ["prefix+tab", "alt+up"]
cycle_pane_previous = ["prefix+shift+tab", "alt+down"]

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
# Popup width and height accept terminal cells or percentages such as "80%".
# On Windows, command strings run through cmd.exe /d /c.

# Legacy indexed shortcut config is still parsed for compatibility.
# Prefer switch_tab, switch_workspace, and focus_agent for new configs.

# Size of the virtual terminal used when no client is attached.
# Attached clients always use their own terminal size.
[server]

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "dots"
copy_on_select = true
# 분할된 pane 사이의 gap 제거 (구분선 테두리 공유)
pane_gaps = false
# pane 바깥 테두리 제거
pane_outer_borders = false
# 탭이 하나뿐이면 탭 바 숨김
hide_tab_bar_when_single_tab = true
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "terminal_title_stripped"],
  ["agent"],
]
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch"],
]

[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
delivery = "herdr"

[ui.toast.herdr]

[ui.toast.clipboard]

# Play sounds when agents change state in background workspaces
[ui.sound]
enabled = true

[session]

[remote]

[experimental]
pane_history = false

[advanced]
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Matches Ghostty's default scrollback-limit behavior.

# nvim
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# file-viewer
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
